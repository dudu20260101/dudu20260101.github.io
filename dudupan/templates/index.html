<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私有云盘 - 文件共享</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <header>
        <h1>☁️ 简易私有云盘</h1>
        <p>安全存储，凭码分享</p>
    </header>

    <!-- 上传区域 -->
    <div class="card">
        <h3>📤 上传新文件</h3>
        <form action="/upload" method="post" enctype="multipart/form-data">
            <div class="upload-area">
                <div class="form-group">
                    <label>选择文件</label>
                    <input type="file" name="file" required>
                </div>
                <div class="form-group">
                    <label>设置提取码 (邀请码)</label>
                    <input type="text" name="invite_code" placeholder="例如：8888" required autocomplete="off">
                </div>
                <button type="submit">🔒 加密上传</button>
            </div>
        </form>
    </div>

    <!-- 文件列表区域 -->
    <div class="card">
        <h3>📂 已共享文件</h3>
        {% if files %}
        <ul class="file-list">
            {% for filename in files %}
            <li class="file-item">
                <div class="file-info">
                    <span class="file-icon">📄</span>
                    <span class="file-name">{{ filename }}</span>
                </div>
                <a href="/access/{{ filename }}" class="btn-download">获取文件</a>
            </li>
            {% endfor %}
        </ul>
        {% else %}
        <div style="text-align: center; color: #999; padding: 20px;">
            暂无文件，快去上传一个吧！
        </div>
        {% endif %}
    </div>
</div>

</body>
</html>
